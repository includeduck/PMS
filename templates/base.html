{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}PMS{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
</head>
<body>
  <header>
    <strong>PMS</strong>
    <nav>
      <a href="{% url 'accounts:register' %}">Register</a>
      <a href="{% url 'accounts:confirm' %}">Confirm</a>
      <a href="{% url 'accounts:login' %}">Log in</a>
      <form class="inline-form" method="post" action="{% url 'accounts:logout' %}">
        {% csrf_token %}
        <button type="submit">Log off</button>
      </form>
      <a href="{% url 'accounts:network_mode' %}">Network mode</a>
      <a href="{% url 'publications:search' %}">Search</a>
      <a href="{% url 'publications:upload' %}">Upload</a>
      <a href="{% url 'publications:mine' %}">My publications</a>
      <a href="{% url 'accounts:user_search' %}">Users</a>
      <a href="{% url 'orgs:group_search' %}">Groups</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
